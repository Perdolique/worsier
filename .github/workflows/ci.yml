name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --manifest-path fuzz/Cargo.toml
      - run: cargo bench -p worsier-formatter --features benchmarking --no-run

  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: git diff --exit-code -- packages/npm/configuration_schema.json packages/npm/src/types.ts
      - run: pnpm --filter worsier build
      - run: pnpm --filter worsier build:native
      - run: pnpm --filter worsier test
      - run: pnpm --filter worsier test:packed
