name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --manifest-path fuzz/Cargo.toml
      - run: cargo bench -p worsier-benchmark --bench formatter --no-run

  cli-platform:
    strategy:
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo test -p worsier-cli

  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          install-dependencies: true
      - run: rustup toolchain install
      - run: pnpm check:versions
      - run: pnpm generate
      - run: git diff --exit-code -- packages/npm/configuration_schema.json packages/npm/src/types.ts
      - run: pnpm --filter worsier build
      - run: pnpm --filter worsier build:native
      - run: pnpm --filter worsier test
      - run: pnpm --filter worsier test:packed
      - run: pnpm --filter worsier-benchmark test
      - run: pnpm --filter worsier-benchmark smoke
      - run: pnpm --filter worsier-benchmark benchmark:verify
