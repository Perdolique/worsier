name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created }}
      sha: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.sha || steps.release.outputs.sha }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.manual.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        if: github.event_name == 'push'
        id: release
      - name: Approve CI for release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number=$(jq -r '.number' <<< "${RELEASE_PR}")
          head_sha=$(gh pr view "${pr_number}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')

          for _ in {1..12}; do
            run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100" \
              --jq '[.workflow_runs[] | select(.event == "pull_request" and .path == ".github/workflows/ci.yml" and .conclusion == "action_required")][0].id // empty')

            if [[ -n "${run_id}" ]]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"
              exit 0
            fi

            sleep 5
          done

          echo "Release pull request CI did not enter the approval queue" >&2
          exit 1
      - uses: actions/checkout@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          fetch-depth: 0
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch'
        id: manual
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG_NAME}" >&2
            exit 1
          fi

          sha=$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")
          git merge-base --is-ancestor "${sha}" origin/master
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

  validate:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          install-dependencies: true
      - run: rustup toolchain install
      - run: pnpm check:versions
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --manifest-path fuzz/Cargo.toml
      - run: pnpm generate
      - run: git diff --exit-code -- packages/npm/configuration_schema.json packages/npm/src/types.ts
      - run: pnpm --filter worsier build
      - run: pnpm --filter worsier build:native
      - run: pnpm --filter worsier test
      - run: pnpm --filter worsier test:packed

  native:
    needs: [release-please, validate]
    if: needs.release-please.outputs.release_created == 'true'
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            platform: darwin-x64
            runner: macos-26-intel
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-26
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
            runner: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            runner: ubuntu-24.04
            musl: true
            build_args: --cross-compile
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            musl: true
            build_args: --cross-compile
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          install-dependencies: true
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.musl
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        if: matrix.musl
        with:
          tool: cargo-zigbuild
      - name: Build addon
        if: runner.os != 'Windows'
        working-directory: packages/npm
        run: pnpm exec napi build --manifest-path ../../crates/napi/Cargo.toml --output-dir ../../artifacts --platform --release --no-js --target ${{ matrix.target }} ${{ matrix.build_args }}
      - name: Build Windows addon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path crates/napi/Cargo.toml --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/worsier_napi.dll" "artifacts/worsier.${{ matrix.platform }}.node"
      - name: Runtime smoke
        if: matrix.musl != true
        run: node packages/npm/scripts/smoke-native.mts artifacts/worsier.${{ matrix.platform }}.node
      - name: Runtime smoke on musl
        if: matrix.musl == true
        run: |
          node_version=$(cat .node-version)
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "node:${node_version}-alpine" \
            node packages/npm/scripts/smoke-native.mts artifacts/worsier.${{ matrix.platform }}.node
      - name: Stage addon for package smoke
        if: matrix.musl != true && runner.os != 'Windows'
        run: cp artifacts/worsier.${{ matrix.platform }}.node npm/${{ matrix.platform }}/
      - name: Stage Windows addon for package smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "artifacts/worsier.${{ matrix.platform }}.node" "npm/${{ matrix.platform }}/"
      - name: Build package loader
        if: matrix.musl != true
        run: pnpm --filter worsier build
      - name: Smoke packed public API and CLI
        if: matrix.musl != true
        run: pnpm --filter worsier test:packed
      - name: Smoke packed public API and CLI on musl
        if: matrix.musl == true
        run: |
          cp artifacts/worsier.${{ matrix.platform }}.node npm/${{ matrix.platform }}/
          node_version=$(cat .node-version)
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "node:${node_version}-alpine" \
            sh -c 'corepack enable && node packages/npm/scripts/test-packed-package.mts'
      - uses: actions/upload-artifact@v7
        with:
          name: binding-${{ matrix.platform }}
          path: artifacts/*.node
          if-no-files-found: error

  publish:
    needs: [release-please, native]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: Perdolique/automations/.github/actions/setup-pnpm@v3
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          install-dependencies: true
      - run: rustup toolchain install
      - run: npm install --global npm@12.0.2
      - uses: actions/download-artifact@v8
        with:
          pattern: binding-*
          path: artifacts
          merge-multiple: true
      - run: pnpm --filter worsier build
      - name: Distribute artifacts
        run: pnpm exec napi artifacts --package-json-path packages/npm/package.json --output-dir artifacts --npm-dir npm
      - name: Validate package publication
        run: pnpm exec napi pre-publish --package-json-path packages/npm/package.json --npm-dir npm --root-publisher pnpm --no-gh-release --dry-run
      - name: Prepare package publication
        run: pnpm exec napi pre-publish --package-json-path packages/npm/package.json --npm-dir npm --root-publisher pnpm --no-gh-release --skip-optional-publish
      - name: Publish platform packages
        run: |
          publish_log="${RUNNER_TEMP}/npm-publish.log"

          for package_dir in npm/*; do
            package_name=$(node -p "require('./${package_dir}/package.json').name")

            if npm publish "./${package_dir}" --access public >"${publish_log}" 2>&1; then
              cat "${publish_log}"
              continue
            fi

            cat "${publish_log}"

            if grep -Fq "You cannot publish over the previously published versions" "${publish_log}"; then
              package_version=$(node -p "require('./${package_dir}/package.json').version")
              published_version=$(npm view "${package_name}@${package_version}" version)
              if [[ "${published_version}" == "${package_version}" ]]; then
                echo "::warning title=Skipped npm package::${package_name}@${package_version} is already published"
                continue
              fi
            fi

            exit 1
          done
        shell: bash
      - name: Publish root package
        working-directory: packages/npm
        shell: bash
        run: |
          publish_log="${RUNNER_TEMP}/npm-root-publish.log"
          package_name=$(node -p "require('./package.json').name")
          package_version=$(node -p "require('./package.json').version")

          if npm publish --access public >"${publish_log}" 2>&1; then
            cat "${publish_log}"
            exit 0
          fi

          cat "${publish_log}"
          if grep -Fq "You cannot publish over the previously published versions" "${publish_log}"; then
            published_version=$(npm view "${package_name}@${package_version}" version)
            [[ "${published_version}" == "${package_version}" ]]
            exit 0
          fi

          exit 1
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" artifacts/*.node --clobber
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false
