name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs['packages/npm--release_created'] }}
      sha: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || steps.release.outputs['packages/npm--sha'] }}
      tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || steps.release.outputs['packages/npm--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        if: github.event_name == 'push'
        id: release

  native:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            platform: darwin-x64
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            platform: darwin-arm64
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
            runner: windows-11-arm
          - target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            runner: ubuntu-24.04
            musl: true
            build_args: --cross-compile
          - target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            musl: true
            build_args: --cross-compile
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: mlugg/setup-zig@v2
        if: matrix.musl
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@v2
        if: matrix.musl
        with:
          tool: cargo-zigbuild
      - name: Build addon
        if: runner.os != 'Windows'
        working-directory: packages/npm
        run: pnpm exec napi build --manifest-path ../../crates/napi/Cargo.toml --output-dir ../../artifacts --platform --release --no-js --target ${{ matrix.target }} ${{ matrix.build_args }}
      - name: Build Windows addon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path crates/napi/Cargo.toml --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/worsier_napi.dll" "artifacts/worsier.${{ matrix.platform }}.node"
      - name: Runtime smoke
        if: matrix.musl != true
        run: node scripts/smoke-native.mjs artifacts/worsier.${{ matrix.platform }}.node
      - name: Runtime smoke on musl
        if: matrix.musl == true
        run: docker run --rm -v "$PWD:/work" -w /work node:22-alpine node scripts/smoke-native.mjs artifacts/worsier.${{ matrix.platform }}.node
      - uses: actions/upload-artifact@v4
        with:
          name: binding-${{ matrix.platform }}
          path: artifacts/*.node
          if-no-files-found: error

  benchmarks:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run report-only benchmarks
        run: cargo bench -p worsier-formatter --features benchmarking -- --noplot | tee benchmark-results.txt
      - run: pnpm --filter worsier build
      - run: pnpm --filter worsier build:native
      - name: Measure Node.js cold start
        run: pnpm benchmark:node | tee -a benchmark-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt

  publish:
    needs: [release-please, native, benchmarks]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: binding-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results
      - run: pnpm --filter worsier build
      - name: Distribute artifacts
        run: pnpm exec napi artifacts --package-json-path packages/npm/package.json --output-dir artifacts --npm-dir npm
      - name: Validate package publication
        run: pnpm exec napi pre-publish --package-json-path packages/npm/package.json --npm-dir npm --root-publisher pnpm --no-gh-release --dry-run
      - name: Prepare package publication
        run: pnpm exec napi pre-publish --package-json-path packages/npm/package.json --npm-dir npm --root-publisher pnpm --no-gh-release --skip-optional-publish
      - name: Publish platform packages
        run: |
          publish_log="${RUNNER_TEMP}/npm-publish.log"

          for package_dir in npm/*; do
            package_name=$(node -p "require('./${package_dir}/package.json').name")

            if npm publish "./${package_dir}" --access public >"${publish_log}" 2>&1; then
              cat "${publish_log}"
              continue
            fi

            cat "${publish_log}"

            if grep -Fq "You cannot publish over the previously published versions" "${publish_log}"; then
              echo "::warning title=Skipped npm package::${package_name} is already published"
              continue
            fi

            if grep -Fq "Package name triggered spam detection" "${publish_log}"; then
              echo "::warning title=Skipped npm package::${package_name} was blocked by npm spam detection"
              continue
            fi

            exit 1
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package
        working-directory: packages/npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Upload GitHub release assets
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" benchmark-results.txt artifacts/*.node --clobber
        env:
          GH_TOKEN: ${{ github.token }}
