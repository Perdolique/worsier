[workspace]
members = ["benchmark/rust", "crates/cli", "crates/formatter", "crates/napi"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Perdolique/worsier"
rust-version = "1.98"
version = "3.6.1"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
jsonc-parser = { version = "0.34.0", features = ["cst", "serde", "serde_json"] }
libc = "0.2.189"
memchr = "2.8.3"
napi = { version = "3.13.0", default-features = false, features = ["napi8", "tokio_rt"] }
napi-build = "2.5.0"
napi-derive = "3.6.9"
oxc_allocator = "=0.152.0"
oxc_ast = "=0.152.0"
oxc_ast_visit = "=0.152.0"
oxc_parser = { version = "=0.152.0", default-features = false }
oxc_span = "=0.152.0"
rayon = "1.12.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
xattr = "1.6.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
