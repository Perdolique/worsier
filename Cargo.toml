[workspace]
members = ["benchmark/rust", "crates/cli", "crates/formatter", "crates/napi"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Perdolique/worsier"
rust-version = "1.97"
version = "2.8.1"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
ignore = "0.4.25"
jsonc-parser = { version = "0.33.1", features = ["cst", "serde", "serde_json"] }
libc = "0.2.189"
memchr = "2.7.6"
napi = { version = "3.12.1", default-features = false, features = ["napi8", "tokio_rt"] }
napi-build = "2.3.1"
napi-derive = "3.6.3"
oxc_allocator = "=0.144.0"
oxc_ast = "=0.144.0"
oxc_ast_visit = "=0.144.0"
oxc_parser = { version = "=0.144.0", default-features = false }
oxc_span = "=0.144.0"
rayon = "1.11.0"
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_json = "1.0.149"
tempfile = "3.24.0"
thiserror = "2.0.17"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
xattr = "1.6.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
